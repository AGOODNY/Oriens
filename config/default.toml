[app]
language = "zh-CN"
poll_interval_ms = 100
recent_event_limit = 8
knowledge_path = "data/knowledge/items.zh-CN.json"

[rag]
source_path = "data/knowledge/rag-v1/documents.json"
chunks_path = "data/knowledge/rag-v1/chunks.jsonl"
manifest_path = "data/knowledge/rag-v1/manifest.json"
index_path = "data/indexes/rag-v1.sqlite"
eval_path = "data/eval/rag-v1.json"
game_version = "Repentance+ 1.9.7.17.J460"
vector_enabled = true
vector_model_id = "BAAI/bge-m3"
vector_model_path = "data/models/bge-m3"
vector_dimension = 1024
vector_min_similarity = 0.52
vector_query_timeout_seconds = 8.0
retrieval_top_k = 5

[providers.qwen]
region = "cn-beijing"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
api_key_env = "DASHSCOPE_API_KEY"
timeout_seconds = 8.0
max_retries = 1

[model_roles.advice]
provider = "qwen"
model_id = "qwen3.7-flash"
display_name = "千问 3.7 Flash"
input_price_per_million_cny = 0.2
output_price_per_million_cny = 0.8
pricing_input_limit_tokens = 32768
pricing_checked_on = "2026-08-10"

[model_roles.vision]
provider = "qwen"
model_id = "qwen3-vl-flash"
display_name = "千问 3 VL Flash"
input_price_per_million_cny = 0.15
output_price_per_million_cny = 1.5
pricing_input_limit_tokens = 32768
pricing_checked_on = "2026-08-19"

[budget]
run_limit_cny = 0.20

[memory]
enabled = false
recall_max_items = 3
recall_max_chars = 360

[vision]
enabled = false
debug_save_screenshots = false
require_foreground = true
min_confidence = 0.72
max_width = 1280
max_height = 720
max_pixels = 921600
max_encoded_bytes = 1500000
jpeg_quality = 85
min_interval_seconds = 5.0
max_requests_per_run = 8
budget_limit_cny = 0.05

[audio]
