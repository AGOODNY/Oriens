[app]
language = "zh-CN"
poll_interval_ms = 100
recent_event_limit = 8
knowledge_path = "data/knowledge/items.zh-CN.json"

[rag]
pipeline_version = 2
content_version = "rag-v2-huiji-2026-08-10"
source_path = "data/knowledge/rag-v2/chunks.jsonl"
chunks_path = "data/knowledge/rag-v2/chunks.jsonl"
manifest_path = "data/knowledge/rag-v2/manifest.json"
entities_path = "data/knowledge/rag-v2/entities.jsonl"
redirects_path = "data/knowledge/rag-v2/redirects.jsonl"
dependency_audit_path = "data/knowledge/rag-v2/dependency-audit.json"
lua_facts_path = "data/knowledge/rag-v2/lua-facts.jsonl"
overrides_path = "data/dictionaries/rag-v2-overrides.json"
raw_paths = [
  "data/raw/huijiwiki/isaac-2026-08-10/pages.jsonl",
  "data/raw/huijiwiki/isaac-templates-modules-2026-08-10/pages.jsonl",
]
index_path = "data/indexes/rag-v2-faiss-keyword.sqlite"
eval_path = "data/eval/rag-v2.json"
game_version = "Repentance+ 1.9.7.17.J460"
vector_enabled = true
vector_model_id = "BAAI/bge-m3"
vector_model_path = "data/models/bge-m3"
vector_dimension = 1024
vector_min_similarity = 0.58
vector_query_timeout_seconds = 8.0
retrieval_top_k = 5
vector_backend = "faiss"
vector_index_path = "data/indexes/rag-v2.faiss"
vector_batch_size = 32
vector_max_sequence_length = 256

[providers.qwen]
region = "cn-beijing"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
api_key_env = "DASHSCOPE_API_KEY"
timeout_seconds = 8.0
max_retries = 1

[model_roles.advice]
provider = "qwen"
model_id = "qwen3.7-flash"
display_name = "千问 3.7 Flash"
input_price_per_million_cny = 0.2
output_price_per_million_cny = 0.8
pricing_input_limit_tokens = 32768
pricing_checked_on = "2026-08-10"

[budget]
run_limit_cny = 0.20

[audio]
input_format = "pcm_s16le"
input_sample_rate = 16000
input_channels = 1
input_sample_width_bytes = 2
chunk_duration_ms = 100
max_recording_seconds = 30.0
min_recording_ms = 250
silence_rms_threshold = 90
noise_rms_threshold = 180
playback_format = "pcm_s16le"
playback_sample_rate = 24000
playback_channels = 1
playback_queue_max_chunks = 64

[voice]
enabled = true
push_to_talk_key = "Space"
asr_provider = "qwen"
asr_model_id = "qwen3-asr-flash-realtime"
asr_endpoint = "wss://{workspace_id}.cn-beijing.maas.aliyuncs.com/api-ws/v1/realtime"
asr_language = "zh"
asr_timeout_seconds = 12.0
asr_max_retries = 1
asr_price_per_second_cny = 0.00033
tts_provider = "qwen"
tts_model_id = "cosyvoice-v3-flash"
tts_endpoint = "wss://{workspace_id}.cn-beijing.maas.aliyuncs.com/api-ws/v1/inference"
tts_voice = "longanli_v3"
tts_rate = 1.0
tts_volume = 50
tts_format = "pcm"
tts_sample_rate = 24000
tts_timeout_seconds = 12.0
tts_max_retries = 1
tts_max_segment_chars = 80
tts_price_per_10k_chars_cny = 1.0
pricing_checked_on = "2026-08-12"
workspace_id_env = "DASHSCOPE_WORKSPACE_ID"
